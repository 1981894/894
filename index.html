/* Compact, balanced product detail layout */
.detail-back{border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:28px}
.detail-product{display:grid;grid-template-columns:minmax(0,390px) minmax(0,390px);gap:clamp(22px,3.5vw,42px);align-items:start;max-width:830px;margin:0 auto 48px}

const SUPABASE_URL='https://itrxztewqsvizozdfhlq.supabase.co';

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

  const n=$('#backend-status');if(!n)return;
  const msg=message||(!cloudConfigured?'공용 저장소가 아직 연결되지 않았습니다. 이 파일의 SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY를 설정하고 SQL 설치를 완료해야 다른 기기에 상품이 공유됩니다.':cloudLoadError);

function normalizeProduct(p){return {...p,category:p.category==='옥반지'?'아기제품':p.category,images:Array.isArray(p.images)?p.images:[]}}
async function refreshProducts(quiet=false){
 if(!cloud)return;
 try{
   const fresh=[];let start=0;
   while(true){
     const {data,error}=await cloud.from('catalog_products').select('id,data').range(start,start+499).order('id');
     if(error)throw error;
     for(const row of (data||[])){if(row.data&&typeof row.data==='object')fresh.push(normalizeProduct({...row.data,id:row.id}))}
     if(!data||data.length<500)break;
     start+=500;
   }
   products=fresh;cloudLoadError='';cloudLoading=false;showBackendStatus();
   if(state.page!=='form')render();
 }catch(err){
   cloudLoading=false;cloudLoadError='공용 상품 데이터를 불러오지 못했습니다. 인터넷 연결과 Supabase URL·키·SQL 권한을 확인하세요. ('+(err.message||'오류')+')';

}
function dataUrlToBlob(dataUrl){
 const m=/^data:([^;,]+)?(;base64)?,([\s\S]*)$/.exec(dataUrl);
 if(!m)throw Error('이미지 데이터 형식이 올바르지 않습니다.');
 const bytes=m[2]?atob(m[3]):decodeURIComponent(m[3]);
 if(m[2]){const u=new Uint8Array(bytes.length);for(let i=0;i<bytes.length;i++)u[i]=bytes.charCodeAt(i);return new Blob([u],{type:m[1]||'image/jpeg'})}
 return new Blob([bytes],{type:m[1]||'image/jpeg'});
}

 if(!imageSource)return '';
 if(/^https:\/\//i.test(imageSource))return imageSource;
 if(!imageSource.startsWith('data:image/'))throw Error('이전 이미지의 형식을 확인할 수 없습니다. 이미지를 다시 첨부해 주세요.');
 const blob=dataUrlToBlob(imageSource);
 const name='products/'+String(productId).replace(/[^a-zA-Z0-9_-]/g,'_')+'/'+makeUniqueToken()+'.jpg';
 const {error}=await requireCloud().storage.from(STORAGE_BUCKET).upload(name,blob,{contentType:blob.type||'image/jpeg',upsert:false,cacheControl:'3600'});
 if(error)throw Error('이미지 서버 업로드 실패: '+error.message);
 return cloud.storage.from(STORAGE_BUCKET).getPublicUrl(name).data.publicUrl;
}
async function publishProduct(p){

}
function storagePath(imageURL){
 const prefix=SUPABASE_URL.replace(/\/$/,'')+'/storage/v1/object/public/'+STORAGE_BUCKET+'/';
 return typeof imageURL==='string'&&imageURL.startsWith(prefix)?decodeURIComponent(imageURL.slice(prefix.length).split('?')[0]):null;
}
async function cleanUnusedImages(before,after){
 const next=new Set([after?.thumb,...(after?.images||[])]);
 const discarded=[before?.thumb,...(before?.images||[])].filter(url=>url&&!next.has(url)).map(storagePath).filter(Boolean);
 if(!discarded.length)return;
 const {error}=await cloud.storage.from(STORAGE_BUCKET).remove([...new Set(discarded)]);
 if(error)console.warn('사용하지 않는 이미지 정리 실패:',error.message);
}

 const legacyCount=products.filter(p=>!isCurrentCategory(p.category)).length;
 const tabs=[['전체','전체',products.length],...CATS.map(([ko])=>[ko,ko,products.filter(p=>p.category===ko).length]),...(legacyCount?[['이전 분류','분류 변경 필요',legacyCount]]:[])];
 return `<div class="section-top"><button class="back" onclick="navigate('home')"><span class="back-arrow" aria-hidden="true">←</span>홈으로</button><button class="link-btn" onclick="logout()">로그아웃</button></div><h1 class="heading">상품 관리</h1><p class="sub">카테고리별로 상품을 등록하고 수정하거나 삭제할 수 있습니다.</p><div class="toolbar"><button class="action" onclick="startForm(null,${isCurrentCategory(active)?esc(JSON.stringify(active)):'null'})">＋ 상품 등록하기</button><span class="sub">전체 상품 ${products.length}개</span></div><div class="admin-tabs">${tabs.map(([v,label,n])=>`<button class="admin-tab ${active===v?'selected':''}" onclick="filterAdmin(${esc(JSON.stringify(v))})">${label} <span>${n}</span></button>`).join('')}</div>${cloud&&legacyProducts.length?`<div class="migration-box"><strong>이 컴퓨터에만 저장되었던 상품 이전</strong><div>기존 브라우저의 상품 ${legacyProducts.length}개 · 아직 서버에 없는 상품 ${legacyProducts.filter(p=>!products.some(x=>x.id===p.id)).length}개</div><div id="migration-progress">이전하면 다른 기기에서도 상품과 이미지를 확인할 수 있습니다.</div><div class="migration-actions"><button type="button" id="migration-btn" class="mini" onclick="migrateLegacyProducts()">기존 상품 서버로 이전</button><button type="button" class="mini" onclick="exportLegacyBackup()">기존 상품 JSON 백업</button><button type="button" class="mini" onclick="pickBackupForMigration()">백업 JSON 불러오기</button></div></div>`:cloud?`<div class="migration-box"><strong>기존 상품 백업을 가지고 계신가요?</strong><div class="migration-actions"><button type="button" class="mini" onclick="pickBackupForMigration()">백업 JSON 불러오기</button></div><div>파일을 불러온 후 나타나는 ‘기존 상품 서버로 이전’ 버튼을 눌러주세요.</div></div>`:''}<div class="admin-list-title"><strong>${esc(active)} 상품 목록 (${sorted.length})</strong>${isCurrentCategory(active)?`<button class="mini" onclick="navigate('category',${esc(JSON.stringify(active))})">상품 페이지 보기 →</button>`:''}</div><div>${sorted.length?sorted.map(p=>`<div class="manage">${adminProductLink(p,p.thumb?`<img src="${esc(p.thumb)}" alt="${esc(p.name)}">`:'<span class="placeholder" aria-hidden="true">✦</span>','manage-thumb-link')}<div class="grow">${adminProductLink(p,`<strong>${esc(p.name)}</strong><span class="manage-link-arrow" aria-hidden="true">↗</span>`,'manage-name-link')}<p>${esc(p.category)} · ${price(p.price,p.priceInquiry)}</p></div><button class="mini" onclick="startForm(${esc(JSON.stringify(p.id))})">수정</button><button class="mini" onclick="removeProduct(${esc(JSON.stringify(p.id))})">삭제</button></div>`).join(''):'<div class="empty">이 카테고리에 등록된 상품이 없습니다.<br>상품 등록하기 버튼을 눌러 추가해 주세요.</div>'}</div>`;
}
function filterAdmin(category){state.adminCategory=category;render()}

function logout(){state.authenticated=false;adminExpiresAt=0;state.editId=null;state.editReturn=null;clearAdminDeadline();if(cloud)cloud.auth.signOut().catch(console.warn);updateAdminHeader();navigate('home');toast('관리자 로그아웃되었습니다.')}
function startForm(id=null,cat=null){if(!checkAdminSession()){navigate('login');return}resetFormImageDraft();let p=products.find(x=>x.id===id);state.editReturn=p&&state.page==='detail'&&state.id===id?{id:p.id,category:p.category}:null;state.editId=id;state.category=p?.category||cat||null;navigate('form',state.category)}
function form(){if(!state.authenticated)return login();let p=products.find(x=>x.id===state.editId);const returnAction=p&&state.editReturn?.id===p.id?`navigate('detail',${esc(JSON.stringify(p.category))},${esc(JSON.stringify(p.id))})`:`navigate('admin')`;return `<div class="section-top"><button class="back" onclick="${returnAction}"><span class="back-arrow" aria-hidden="true">←</span>상품 관리로 돌아가기</button></div><div class="form-wrap"><div class="eyebrow">PRODUCT EDITOR</div><h1 class="heading" style="margin:15px 0 30px">${p?'상품 수정':'새 상품 등록'}</h1><form id="product-form" onsubmit="saveProduct(event)"><div class="form-row"><label for="category">카테고리 *</label><select id="category" class="field" required>${p&&!isCurrentCategory(p.category)?`<option value="" selected disabled>이전 분류: ${esc(p.category)} — 새 카테고리를 선택하세요</option>`:''}${CATS.map(x=>`<option value="${x[0]}" ${(p?.category||state.category)===x[0]?'selected':''}>${x[0]}</option>`).join('')}</select></div><div class="form-row"><label for="name">상품명 *</label><input id="name" class="field" maxlength="100" required placeholder="예: 18K 베이직 체인 팔찌" value="${esc(p?.name||'')}"></div><div class="form-row"><label for="price">판매 가격 (원) *</label><label class="price-inquiry-option" for="priceInquiry"><input id="priceInquiry" type="checkbox" ${p?.priceInquiry?'checked':''} onchange="togglePriceInquiry()"><span>가격문의로 표시</span></label><input id="price" class="field" type="number" min="0" max="999999999999" step="1" ${p?.priceInquiry?'disabled':'required'} placeholder="숫자로 입력" value="${p?.priceInquiry?'':(p?.price??'')}"><div class="file-help">가격문의를 체크하면 고객에게 '가격문의'로 표시됩니다.</div></div><div class="form-row"><label for="thumb">대표 썸네일 이미지 ${p?'(변경할 때만 선택)':'*'}</label><input id="thumb" class="field" type="file" accept="image/*" ${p?'':'required'} onchange="previewThumb()"><div class="file-help">대표 이미지는 1장, 권장 비율 1:1.15입니다. X를 누르면 선택한 이미지를 제외할 수 있습니다.</div><div id="thumb-preview" class="previews"></div></div><div class="form-row"><label for="description">상세 설명</label><textarea id="description" class="field" placeholder="순도, 중량, 사이즈, 구성품 등 상세정보를 적어주세요.">${esc(p?.description||'')}</textarea></div><div class="form-row"><label for="detail-images">상세 이미지 (여러 장 선택 가능)</label><input id="detail-images" class="field" type="file" accept="image/*" multiple onchange="addDetailImages(this)"><div class="file-help">이미지 선택을 여러 번 반복해도 기존 이미지 뒤에 추가됩니다. 각 이미지 우측 하단 X를 눌러 개별 삭제할 수 있습니다.</div><div id="detail-image-count" class="file-help">상세 이미지 ${Array.isArray(p?.images)?p.images.length:0}장</div><div id="detail-preview" class="previews"></div></div><button class="action" style="width:100%;margin-top:15px" type="submit">${p?'수정 내용 저장':'상품 등록하기'}</button><button class="action ghost" type="button" style="width:100%;margin-top:9px" onclick="${returnAction}">취소</button></form></div>`}
function togglePriceInquiry(){const checked=$('#priceInquiry').checked;const field=$('#price');field.disabled=checked;field.required=!checked;if(checked)field.value='';}
// 이미지 수정은 저장 전까지 임시 상태입니다. 취소하면 기존 상품 이미지는 그대로 남습니다.
let pendingDetailImages=[];
let removedExistingDetailIndices=new Set();
let existingThumbRemoved=false;
let pendingThumbURL=null;
function resetPendingDetailImages(){
  pendingDetailImages.forEach(item=>URL.revokeObjectURL(item.url));
  pendingDetailImages=[];
}
function resetFormImageDraft(){
  resetPendingDetailImages();
  removedExistingDetailIndices.clear();
  existingThumbRemoved=false;
  if(pendingThumbURL){URL.revokeObjectURL(pendingThumbURL);pendingThumbURL=null;}
}
function previewTile(holder,src,alt,removeLabel,onRemove){
  const tile=document.createElement('div');tile.className='image-preview-tile';
  const img=document.createElement('img');img.src=src;img.alt=alt;
  const remove=document.createElement('button');remove.type='button';remove.className='image-remove-btn';
  remove.textContent='×';remove.title=removeLabel;remove.setAttribute('aria-label',removeLabel);
  remove.addEventListener('click',onRemove);
  tile.append(img,remove);holder.appendChild(tile);
}
function previewThumb(){
  if(pendingThumbURL){URL.revokeObjectURL(pendingThumbURL);pendingThumbURL=null;}
  const file=$('#thumb')?.files?.[0];
  if(file)pendingThumbURL=URL.createObjectURL(file);
  renderThumbPreview();
}
function removeThumbImage(){
  const input=$('#thumb');
  if(input?.files?.length){
    input.value='';
    if(pendingThumbURL){URL.revokeObjectURL(pendingThumbURL);pendingThumbURL=null;}
  }else{
    existingThumbRemoved=true;
  }
  renderThumbPreview();
}
function renderThumbPreview(){
  const holder=$('#thumb-preview');if(!holder)return;
  holder.replaceChildren();
  const file=$('#thumb')?.files?.[0];
  const old=products.find(p=>p.id===state.editId);
  if(file&&pendingThumbURL){
    previewTile(holder,pendingThumbURL,'새 대표 이미지','새 대표 이미지 제외',removeThumbImage);
  }else if(old?.thumb&&!existingThumbRemoved){
    previewTile(holder,old.thumb,'기존 대표 이미지','기존 대표 이미지 삭제',removeThumbImage);
  }
}
function addDetailImages(input){
  for(const file of input.files){
    if(!file.type.startsWith('image/'))continue;
    pendingDetailImages.push({file,url:URL.createObjectURL(file)});
  }
  input.value=''; // 같은 파일을 다시 첨부할 수 있도록 파일 선택창 초기화
  renderDetailImagePreview();
}
function removeExistingDetailImage(index){
  removedExistingDetailIndices.add(index);
  renderDetailImagePreview();
}
function removePendingDetailImage(index){
  const removed=pendingDetailImages.splice(index,1)[0];
  if(removed)URL.revokeObjectURL(removed.url);
  renderDetailImagePreview();
}
function renderDetailImagePreview(){
  const holder=$('#detail-preview');if(!holder)return;
  const old=products.find(p=>p.id===state.editId);
  const existing=Array.isArray(old?.images)?old.images:[];
  holder.replaceChildren();
  let kept=0;
  existing.forEach((src,i)=>{
    if(removedExistingDetailIndices.has(i))return;
    kept++;
    previewTile(holder,src,`기존 상세 이미지 ${i+1}`,`기존 상세 이미지 ${i+1} 삭제`,()=>removeExistingDetailImage(i));
  });
  pendingDetailImages.forEach((item,i)=>{
    previewTile(holder,item.url,`추가 상세 이미지 ${i+1}`,`추가 상세 이미지 ${i+1} 삭제`,()=>removePendingDetailImage(i));
  });
  const count=$('#detail-image-count');
  if(count)count.textContent=`상세 이미지 총 ${kept+pendingDetailImages.length}장 (기존 ${kept}장 · 추가 ${pendingDetailImages.length}장)`;
}
function resizeImage(file,max=1250,quality=.76){return new Promise((resolve,reject)=>{let u=URL.createObjectURL(file),im=new Image();im.onload=()=>{let scale=Math.min(1,max/Math.max(im.width,im.height));let cv=document.createElement('canvas');cv.width=Math.round(im.width*scale);cv.height=Math.round(im.height*scale);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(u);resolve(cv.toDataURL('image/jpeg',quality))};im.onerror=()=>{URL.revokeObjectURL(u);reject(Error('이미지를 읽지 못했습니다.'))};im.src=u})}
async function saveProduct(e){
 e.preventDefault();if(!checkAdminSession()){navigate('login');return;}
 const button=e.target.querySelector('[type="submit"]');button.disabled=true;
 const initialLabel=button.textContent;
 try{
  requireCloud();
  const old=products.find(x=>x.id===state.editId);
  const t=$('#thumb').files[0],ds=pendingDetailImages.map(item=>item.file);
  if(!t&&!old){toast('썸네일 사진을 등록해 주세요.');return;}
  const isInquiry=$('#priceInquiry').checked,priceValue=isInquiry?null:Number($('#price').value);
  const id=old?.id||'p'+Date.now()+'-'+makeUniqueToken().slice(0,8);
  const category=$('#category').value,name=$('#name').value.trim(),description=$('#description').value.trim();
  if(!name||!isCurrentCategory(category)||(!isInquiry&&(!Number.isFinite(priceValue)||priceValue<0)))throw Error('상품 정보를 확인해 주세요.');
  button.textContent='이미지 업로드 및 서버 저장 중...';
  const thumb=t?await uploadImage(await resizeImage(t),id):(existingThumbRemoved?'':(old?.thumb||''));
  const images=[...(Array.isArray(old?.images)?old.images.filter((_,i)=>!removedExistingDetailIndices.has(i)):[])];
  for(const file of ds){images.push(await uploadImage(await resizeImage(file,1200,.72),id));}
  if(!checkAdminSession())throw Error('관리자 로그인이 만료되었습니다. 다시 로그인해 주세요.');
  const p={id,category,name,price:priceValue,priceInquiry:isInquiry,description,thumb,images,created:old?.created||Date.now()};
  await publishProduct(p); // 서버 성공 이후 화면을 갱신 (실패 시 기존 상품 그대로)
  products=old?products.map(x=>x.id===old.id?p:x):[...products,p];
  if(old)cleanUnusedImages(old,p).catch(console.warn);
  const returnToDetail=!!(old&&state.editReturn?.id===old.id);
  state.editId=null;state.editReturn=null;
  if(returnToDetail)navigate('detail',p.category,p.id);else navigate('admin');
  toast(old?'상품이 서버에 수정되었습니다.':'상품이 서버에 등록되었습니다.');
 }catch(err){toast(err.message||'서버 저장에 실패했습니다.');console.warn(err);}
 finally{button.textContent=initialLabel;button.disabled=false;}
}
async function removeProduct(id){
 if(!checkAdminSession()||!cloud)return;
 if(!confirm('이 상품을 서버에서 삭제할까요? 모든 기기에서 사라집니다.'))return;
 const old=products.find(x=>x.id===id);if(!old)return;
 try{
  const {error}=await cloud.from('catalog_products').delete().eq('id',id);
  if(error)throw error;
  products=products.filter(x=>x.id!==id);render();toast('모든 기기에서 상품이 삭제되었습니다.');
  cleanUnusedImages(old,null).catch(console.warn);
 }catch(err){toast('서버 삭제 실패: '+(err.message||'오류'));}
}
function render(){updateAdminHeader();let content=state.page==='home'?home():state.page==='category'?category():state.page==='detail'?detail():state.page==='login'?login():state.page==='admin'?admin():state.page==='form'?form():home();$('#view').innerHTML=content;document.body.classList.toggle('home-current',state.page==='home');if(state.page==='form'){renderThumbPreview();renderDetailImagePreview();}}
// URL은 화면 위치만 저장하고, 상품 정보와 이미지는 Supabase 공용 서버에서 불러옵니다.
let hash=decodeURIComponent(location.hash.slice(1)).split('|');state.page=['home','category','detail'].includes(hash[0])?hash[0]:'home';state.category=hash[1]==='옥반지'?'아기제품':hash[1]||null;state.id=hash[2]||null;initializeCatalog();
// 다른 기기에서 등록된 상품도 새로고침 없이 확인할 수 있도록 주기적으로 갱신합니다.
setInterval(()=>{if(cloud&&state.page!=='form'&&!document.hidden)refreshProducts(true)},45000);
window.addEventListener('focus',()=>{if(cloud&&state.page!=='form')refreshProducts(true)});
</script></body></html>
